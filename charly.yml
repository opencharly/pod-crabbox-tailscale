# pod-crabbox-tailscale — the tailnet-joinable CachyOS lease image for the
# Crabbox containerd provider.
#
# One repo per image (W5.2). The image imports the base lease image at a PINNED
# tag, so the image tag and the git tag name the same build:
# ghcr.io/opencharly/pod-crabbox-tailscale:<tag> is the tree tagged <tag>.
repo: github.com/opencharly/pod-crabbox-tailscale
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - pac
import:
    # The lease base image, pinned at the newest base tag. A variant imports one
    # image and inherits the whole `/crabbox` contract (sshd on 2222, the
    # `crabbox` login user with passwordless sudo, the read-only inputs, the
    # shared bootstrap and the readiness hook).
    - crabbox: '@github.com/opencharly/pod-crabbox:v2026.307.1828'
discover:
    - path: candy
      recursive: true

# The tailscale variant. The lease contract is inherited unchanged; this image
# adds the `tailscale` CLI and the `tailscaled` daemon, plus the systemd drop-in
# that forces tailscaled off UDP GSO for a TSI lease.
pod-crabbox-tailscale:
    candy:
        description: |
            The tailnet-joinable CachyOS lease image for a Crabbox `containerd`
            lease: the base `pod-crabbox` contract (sshd on 2222, user `crabbox`
            with passwordless sudo, the read-only `/crabbox` inputs, the shared
            bootstrap and the readiness hook) with the Arch `tailscale` package,
            which ships BOTH the `tailscale` CLI and the `tailscaled` daemon. The
            daemon binary is the load-bearing half: a lease whose consumer runs
            `exec /usr/bin/tailscaled` fails with `no such file or directory` on
            an image that ships only the CLI. The daemon is STARTED by this
            image's own entrypoint (`/usr/local/bin/crabbox-tailscale-init`),
            which exports `TS_DEBUG_DISABLE_UDP_GSO=1` — the libkrunfw TSI socket
            deadlock workaround — into the daemon's environment and then hands
            over to the base entrypoint; `tailscaled.service` is also enabled with
            the same variable through a drop-in, for a venue that runs systemd as
            PID 1. The setting only disables UDP GSO, so it is harmless on a
            non-TSI lease too. Bringing the mesh up
            (`tailscale up --authkey=…`) is a runtime concern and is never baked
            into the image.
        base: crabbox.pod-crabbox
        # An imported/OCI base does not inherit the parent's distro/build values,
        # so the CachyOS chain is declared here; the base image is itself CachyOS.
        distro:
            - cachyos
            - arch
        # PID 1 is the base image's `sshd -D`, which must run as root; the LOGIN
        # user stays `crabbox` (uid 1000), created by the inherited candy.
        user: root
        uid: 0
        gid: 0
        # The variant's own entrypoint: it starts `tailscaled` (with the TSI
        # workaround in the daemon's own environment) and then hands over to the
        # base `/usr/local/bin/crabbox-lease-init`, which applies the read-only
        # `/crabbox` inputs and `exec`s `sshd -D`. Declaring it here is what makes
        # the daemon actually RUN on the venue this image declares.
        entrypoint:
            - /usr/local/bin/crabbox-tailscale-init
        candy:
            - tailscale-lease

# =============================================================================
# check-pod-crabbox-tailscale-contract — the disposable R10 bed for this image.
#
# WHY THERE IS NO "PERFORM" STEP. Every other pod-crabbox bed has the three-step
# ABSENCE -> PERFORM -> PRESENCE shape because its subject starts LATE: the lease
# unit consumes the inputs and only then does the engine or cluster come up, so
# an ABSENCE step has something to be absent about. This image's subject starts
# at the ENTRYPOINT — there is no bootstrap gate between container start and the
# daemon — so by the time any live step runs, tailscaled is already up. Getting a
# step 1 would mean inventing a gate, i.e. changing product behaviour for a test,
# so the bed does not.
#
# THE DISCRIMINATOR LIVES OUTSIDE THE BED and is stated with it: on the base
# image (opencharly/pod-crabbox) the daemon binary, the shared starter and the
# drop-in are all absent, so every assertion below FAILS there. A PRESENCE-only
# bed whose detector is proven to fail on the base image is a gate; without that
# control it would not be.
#
# THE TAILNET JOIN IS NOT ASSERTED, deliberately: `tailscale up` needs an auth
# key and a lease venue does not carry one (R8 — a live boundary runs live or
# skips visibly, never mocked). What IS asserted is the part the image owns.
check-pod-crabbox-tailscale-contract:
    pod:
        image: pod-crabbox-tailscale
        disposable: true
        lifecycle: test
        plan:
            # IDENTITY, NOT A SUBSTRING. Round 1 caught the first version matching the
            # CHECKING SHELL: its own argv contains the string `tailscaled`, so the loop
            # read the shell's environ and could report success with NO daemon running.
            # Exact identity is `comm`, the kernel's own process name, and the detecting
            # shell is excluded by pid as well.
            - check: the daemon is running with the TSI workaround in its own environment
              id: tailscale-daemon-running
              exit_status: 0
              command: |
                set -eu
                found=0
                for p in /proc/[0-9]*; do
                  pid="${p#/proc/}"
                  [ "$pid" = "$$" ] && continue
                  [ -r "$p/comm" ] || continue
                  [ "$(cat "$p/comm")" = tailscaled ] || continue
                  if ! grep -qa 'TS_DEBUG_DISABLE_UDP_GSO=1' "$p/environ"; then
                    echo 'tailscaled is running WITHOUT the TSI workaround in its environment' >&2
                    exit 1
                  fi
                  found=$((found + 1))
                done
                if [ "$found" -lt 1 ]; then
                  echo 'no tailscaled process is running: the entrypoint did not start the daemon' >&2
                  exit 1
                fi
            # THE DETECTOR MUST BE ABLE TO FAIL. Same loop, an identity that cannot exist:
            # if this step ever reports success, the detector is matching something other
            # than the process it names and the assertion above proves nothing.
            - check: the daemon detector can fail, so the assertion above is not vacuous
              id: tailscale-detector-can-fail
              command: |
                set -eu
                probe=tailscale-does-not-exist
                hit=0
                for p in /proc/[0-9]*; do
                  [ -r "$p/comm" ] || continue
                  [ "$(cat "$p/comm")" = "$probe" ] && hit=1
                done
                if [ "$hit" = 1 ]; then
                  echo 'the detector matched a process it should never match' >&2
                  exit 0
                fi
                exit 1
              exit_status: 1
            - check: the daemon listens on the socket the entrypoint gives it
              id: tailscale-daemon-socket
              exit_status: 0
              command: |
                set -eu
                test -S /run/tailscale/tailscaled.sock
